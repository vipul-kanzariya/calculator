<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <link rel="stylesheet" href="style.css">
    <title>Calculator</title>
</head>
<body>
    <div class="calculator">
        <div>
            <input type="text" class="display" id="show" disabled>
        </div>
        <div class="buttons">
            <div class="btn">
                <button class="num" onclick="clearDisplay()">AC</button>
                <button class="num operator" onclick="operator('%')">%</button>

            </div>
            <div class="btn">
                <button class="num" onclick="num('1')">1</button>
                <button class="num" onclick="num('4')">4</button>
                <button class="num" onclick="num('7')">7</button>
                <button class="num" onclick="num('0')">0</button>

            </div>
             <div class="btn">
                <button class="num" onclick="num('2')">2</button>
                <button class="num" onclick="num('5')">5</button>
                <button class="num" onclick="num('8')">8</button>
                <button class="num" onclick="operator('.')">.</button>

            </div>
             <div class="btn">
                <button class="num" onclick="num('3')">3</button>
                <button class="num" onclick="num('6')">6</button>
                <button class="num" onclick="num('9')">9</button>
                <button class="num equal" onclick="calculate()">=</button>

            </div>
             <div class="btn">
                <button class="num operator" onclick="operator('/')">/</button>
                <button class="num operator" onclick="operator('*')">x</button>
                <button class="num operator" onclick="operator('+')">+</button>
                <button class="num operator" onclick="operator('-')">-</button>

            </div>

        </div>
    </div>
    
</body>
<script src="script.js"></script>
</html>
